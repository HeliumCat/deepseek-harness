# The dsh pet-worker application: the worker service, its one preset, and the
# viewer handoff over the dsh-web-app surface. The profile stacks
# `@deepseek-ai/dsh-base`, `@deepseek-ai/dsh-web-app`, and this bundle; this
# patch replaces the web runtime's browser handoff so the worker opens only the
# pet window and prints the pet/MCP URLs itself.

- insert:
    # The worker service, its capped history, the pet page/API, and the
    # localhost MCP endpoint. `workspace` is the directory worker sessions run
    # in; `historyRoot` and `tokenFile` live under the Harness home.
    - id: pet-worker
      name: '@deepseek-ai/dsh-pet-app'
      config:
        workspace: !!js process.cwd()
        historyRoot: !!js dshHomePath('pet', 'history')
        historyLimit: 1000
        presetId: pet-worker
        childPresetId: standard
        mcpPath: /pet/mcp
        pagePath: /pet
        tokenFile: !!js dshHomePath('pet', 'token')
        windowMode: auto

    # The lead subagent owns the delegation tree and Session lineage.
    - id: preset-pet-worker
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: pet-worker
        name: Pet lead subagent
        description: Owns the Session for forwarding assignments from calling Agents.
        order: 90
        plugins: []

# The pet window, not the full Web UI, is the surface this profile opens.
# Values omitted here would fall back to the web-app row, so restate the ones
# this layer keeps.
- id: web-runtime
  config:
    publicUrl: !!js ctx.webStartup.publicUrl
    surfaceContext: true
    openBrowser: false
    printUrl: false
